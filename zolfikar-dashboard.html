<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tutor Dashboard — Zolfikar</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0f0e17; --surface:#1a1828; --card:#232136;
  --green:#00e58a; --yellow:#ffd93d; --red:#ff6b6b;
  --blue:#4cc9f0; --purple:#c77dff; --orange:#ff9f43;
  --text:#fffffe; --muted:#a7a9be;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Baloo 2',cursive; background:var(--bg); color:var(--text); min-height:100vh; }

/* LOGIN */
#login-screen {
  min-height:100vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:20px;
  background:radial-gradient(ellipse at 30% 30%, #1e1b4b 0%, var(--bg) 60%);
  text-align:center; padding:24px;
}
.login-icon { font-size:72px; }
.login-title { font-size:clamp(28px,5vw,44px); font-weight:800; }
.login-title span { color:var(--green); }
.login-sub { color:var(--muted); font-size:15px; max-width:340px; line-height:1.7; }

.login-input {
  background:var(--card); border:2px solid rgba(255,255,255,0.1);
  color:var(--text); font-family:'Baloo 2',cursive; font-size:17px; font-weight:700;
  padding:14px 20px; border-radius:14px; outline:none;
  width:100%; max-width:320px; text-align:center;
  transition:border-color 0.2s;
}
.login-input:focus { border-color:var(--green); }
.login-input::placeholder { color:var(--muted); }

.login-btn {
  background:linear-gradient(135deg,var(--green),#00b368);
  color:#0f0e17; font-family:'Baloo 2',cursive; font-size:18px; font-weight:800;
  padding:14px 44px; border:none; border-radius:50px; cursor:pointer;
  box-shadow:0 8px 32px rgba(0,229,138,0.35);
  transition:transform 0.2s;
}
.login-btn:hover { transform:translateY(-2px); }
.login-error { color:var(--red); font-size:14px; font-weight:700; min-height:20px; }

/* DASHBOARD */
#dashboard { display:none; padding:24px; max-width:960px; margin:0 auto; }

.dash-header {
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:16px; margin-bottom:32px; padding-top:16px;
}
.dash-title { font-size:clamp(24px,4vw,36px); font-weight:800; }
.dash-title span { color:var(--green); }

.logout-btn {
  background:var(--card); border:2px solid rgba(255,255,255,0.1);
  color:var(--muted); font-family:'Baloo 2',cursive; font-size:14px; font-weight:700;
  padding:8px 20px; border-radius:50px; cursor:pointer;
  transition:border-color 0.2s, color 0.2s;
}
.logout-btn:hover { border-color:var(--red); color:var(--red); }

/* STATS ROW */
.stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:28px; }
.stat-card {
  background:var(--card); border:2px solid rgba(255,255,255,0.06);
  border-radius:18px; padding:22px 20px; text-align:center;
}
.stat-num { font-size:42px; font-weight:800; line-height:1; }
.stat-num.g { color:var(--green); }
.stat-num.y { color:var(--yellow); }
.stat-num.b { color:var(--blue); }
.stat-label { font-size:13px; color:var(--muted); margin-top:4px; font-weight:700; text-transform:uppercase; letter-spacing:1px; }

/* REFRESH */
.refresh-btn {
  background:var(--surface); border:2px solid rgba(255,255,255,0.08);
  color:var(--text); font-family:'Baloo 2',cursive; font-size:14px; font-weight:700;
  padding:10px 22px; border-radius:50px; cursor:pointer; margin-bottom:20px;
  transition:border-color 0.2s;
}
.refresh-btn:hover { border-color:var(--green); }

/* TABLE */
.table-wrap { overflow-x:auto; border-radius:16px; border:2px solid rgba(255,255,255,0.06); }
table { width:100%; border-collapse:collapse; }
thead tr { background:var(--surface); }
th {
  text-align:left; padding:14px 18px;
  font-size:12px; font-weight:700; text-transform:uppercase;
  letter-spacing:2px; color:var(--muted);
}
tbody tr { border-top:1px solid rgba(255,255,255,0.05); transition:background 0.15s; }
tbody tr:hover { background:rgba(255,255,255,0.03); }
td { padding:16px 18px; font-size:15px; vertical-align:top; }

.score-chip {
  display:inline-block; padding:4px 12px; border-radius:50px;
  font-size:13px; font-weight:800;
}
.score-high { background:rgba(0,229,138,0.15); color:var(--green); border:1px solid rgba(0,229,138,0.3); }
.score-mid  { background:rgba(255,217,61,0.15); color:var(--yellow);border:1px solid rgba(255,217,61,0.3); }
.score-low  { background:rgba(255,107,107,0.15);color:var(--red);   border:1px solid rgba(255,107,107,0.3);}

.wrong-pill {
  display:inline-block; background:rgba(255,107,107,0.1);
  border:1px solid rgba(255,107,107,0.2); color:var(--red);
  font-size:12px; font-weight:700; padding:3px 10px; border-radius:50px; margin:2px;
}

.empty-state { text-align:center; padding:60px 20px; color:var(--muted); font-size:16px; }
.empty-state .e-icon { font-size:56px; display:block; margin-bottom:12px; }

.loading { text-align:center; padding:60px 20px; color:var(--muted); font-size:16px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-icon">🔐</div>
  <h1 class="login-title">Tutor <span>Dashboard</span></h1>
  <p class="login-sub">This page is private — only Zolfikar can see student results.</p>
  <input class="login-input" id="pass-input" type="password" placeholder="Enter tutor password..." />
  <button class="login-btn" onclick="checkPassword()">Enter Dashboard →</button>
  <div class="login-error" id="login-error"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dash-header">
    <div class="dash-title">📊 Student <span>Results</span></div>
    <button class="logout-btn" onclick="logout()">Logout ↩</button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-num g" id="stat-total">—</div>
      <div class="stat-label">Total Students</div>
    </div>
    <div class="stat-card">
      <div class="stat-num y" id="stat-avg">—</div>
      <div class="stat-label">Average Score</div>
    </div>
    <div class="stat-card">
      <div class="stat-num b" id="stat-top">—</div>
      <div class="stat-label">Top Score</div>
    </div>
  </div>

  <button class="refresh-btn" onclick="loadResults()">🔄 Refresh Results</button>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Student Name</th>
          <th>Score</th>
          <th>Missed Answers</th>
          <th>Date & Time</th>
        </tr>
      </thead>
      <tbody id="results-body">
        <tr><td colspan="5"><div class="loading">Loading results...</div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://kjsaovbotthyucrkgsyx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_w-gkktwkB8vnaXt9y7BbNg_O82WYjYI';
const TUTOR_PASS   = 'zolfikar2025'; // change this to your preferred password

function checkPassword() {
  const val = document.getElementById('pass-input').value;
  if (val === TUTOR_PASS) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadResults();
  } else {
    document.getElementById('login-error').textContent = '❌ Wrong password. Try again.';
    document.getElementById('pass-input').value = '';
  }
}

document.getElementById('pass-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
});

function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('pass-input').value = '';
  document.getElementById('login-error').textContent = '';
}

async function loadResults() {
  document.getElementById('results-body').innerHTML =
    '<tr><td colspan="5"><div class="loading">⏳ Loading results...</div></td></tr>';
  try {
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/results?select=*&order=played_at.desc`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const data = await res.json();
    renderResults(data);
  } catch(e) {
    document.getElementById('results-body').innerHTML =
      '<tr><td colspan="5"><div class="empty-state"><span class="e-icon">⚠️</span>Could not load results. Check your connection.</div></td></tr>';
  }
}

function renderResults(data) {
  if (!data || data.length === 0) {
    document.getElementById('results-body').innerHTML =
      '<tr><td colspan="5"><div class="empty-state"><span class="e-icon">📭</span>No results yet — share the demo with your first student!</div></td></tr>';
    document.getElementById('stat-total').textContent = '0';
    document.getElementById('stat-avg').textContent   = '—';
    document.getElementById('stat-top').textContent   = '—';
    return;
  }

  // Stats
  const scores = data.map(r => r.total_score);
  const avg    = Math.round(scores.reduce((a,b) => a+b, 0) / scores.length);
  const top    = Math.max(...scores);
  document.getElementById('stat-total').textContent = data.length;
  document.getElementById('stat-avg').textContent   = avg;
  document.getElementById('stat-top').textContent   = top;

  // Table rows
  const tbody = document.getElementById('results-body');
  tbody.innerHTML = data.map((r, i) => {
    const score     = r.total_score;
    const scoreClass= score >= 100 ? 'score-high' : score >= 60 ? 'score-mid' : 'score-low';
    const wrongs    = Array.isArray(r.wrong_answers) ? r.wrong_answers : [];
    const wrongHtml = wrongs.length > 0
      ? wrongs.map(w => `<span class="wrong-pill">${w.question}</span>`).join('')
      : '<span style="color:var(--green);font-size:13px;font-weight:700">✅ No mistakes!</span>';
    const date = r.played_at
      ? new Date(r.played_at).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })
      : '—';
    return `
      <tr>
        <td style="color:var(--muted);font-size:13px">${i+1}</td>
        <td style="font-weight:800">${r.student_name || 'Anonymous'}</td>
        <td><span class="score-chip ${scoreClass}">⭐ ${score}</span></td>
        <td>${wrongHtml}</td>
        <td style="color:var(--muted);font-size:13px">${date}</td>
      </tr>`;
  }).join('');
}
</script>
</body>
</html>
